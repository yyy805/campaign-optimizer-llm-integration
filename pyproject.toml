[project]
name = "campaign-optimizer-review"
version = "0.1.0"
description = "Review-only ontology contracts and LLM integration for the campaign optimizer demo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    'alembic>=1.16.0',
    "jsonschema>=4.26.0",
    "rfc3339-validator>=0.1.4",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# API 子项目有独立 venv 与测试运行方式，主仓收集时排除（2026-08-14 合并后新增）
norecursedirs = ["ontology review api"]
